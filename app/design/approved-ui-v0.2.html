<script>
(()=>{
const root=document.getElementById('lab-v2'),view=root.querySelector('#lv-view');
const base={schema:2,role:'student',studentPage:'lab',teacherPage:'class',group:3,revision:1,current:{vin:3.3,vout:.08,ref:'TP0'},history:[{vin:3.3,vout:.08,rev:1},{vin:3.3,vout:.09,rev:1},{vin:3.3,vout:.08,rev:1}],chat:[],events:[],help:true,submitted:false,photo:false,conclusion:'',teacherMessage:'',feedback:'',reviews:{},classChart:'trend',filter:'all',aiLevel:1,paused:false};
let initial=window.openai?.widgetState?.privateContent?.ui;
let s={...base,...(initial?.schema===2?initial:{})};
let parsed=null,raw='',modal=null,toast='',error='',drafts=[],draftKind='guidance',reportGroup=2,photoUrl='',chartMount=null;
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const B=(text,action,kind='btn',icon='')=>`<button type="button" class="${kind.split(' ').map(k=>'x-'+k).join(' ')}" data-do="${action}">${icon?I(icon):''}${text}</button>`;
const P=(text,kind='')=>`<span class="x-pill ${kind}">${text}</span>`;
const fmt=x=>x==null?'待测':Number(x).toFixed(2);
function result(){let c=s.current;if(c.vin==null||c.vout==null)return 'pending';if(c.vin<3.2||c.vin>3.4||c.vout<0)return 'check';let d=c.vout-c.vin/2;return Math.abs(d)<=.0500001?'pass':d<0?'low':'high'}
const resultText=()=>({pending:'等待复测',pass:'符合判据',low:'输出偏低',high:'输出偏高',check:'待核对条件'}[result()]);
function save(){window.openai?.setWidgetState?.({modelContent:{design:'清爽蓝白',version:'0.2',preview:s.role,screen:s.role==='teacher'?s.teacherPage:s.studentPage,input:'自然语言提取后确认',output:s.current.vout,revision:s.revision},privateContent:{ui:s}})?.catch(()=>{})}
function note(t){root.querySelector('#lv-live').textContent=t}
function event(title,text){s.events.push({time:'刚刚',title,text});s.events=s.events.slice(-12)}
function groups(){return Array.from({length:10},(_,i)=>{let n=i+1,submitted=n===3?s.submitted:[2,6].includes(n)&&!s.reviews[n]?.returned;return {n,submitted,help:n===3?s.help&&!submitted:n===7,step:submitted?8:n===3?5:[3,8,5,4,6,8,3,4,2,5][i],offline:n===9}})}
function outputConfig(history,id='lab-output',height=190){
 const rows=history.map((r,i)=>['第'+(i+1)+'次',r.vout,r.vin/2]);
 const expected=rows[0]?.[2]??1.65,constant=rows.every(r=>Math.abs(r[2]-expected)<.00001);
 const spec={type:'line',x:'测量次序',y:constant?'输出电压':['输出电压','预期输出'],yLabel:'电压 V',yDomain:[0,Math.max(3.5,...rows.map(r=>r[1]))],showLegend:!constant,colors:{'输出电压':'#2868e8','预期输出':'#8a9db9'}};
 if(constant){spec.referenceLines=[{axis:'y',value:expected,label:'预期 '+expected.toFixed(2)+' V'}];spec.referenceBands=[{axis:'y',from:expected-.05,to:expected+.05,label:'允许范围'}]}
 return {id,title:'输出电压变化',showHeader:false,height,columns:['测量次序','输出电压','预期输出'],rows,spec};
}
function classConfig(gs,mode){
 const done=gs.filter(g=>g.submitted).length;
 if(mode==='stages'){const stages=[[2,'预测输出'],[3,'搭建'],[4,'测供电'],[5,'测输出'],[6,'排查'],[8,'已提交']];return {id:'class-stages',title:'小组所处阶段',showHeader:false,height:210,columns:['实验阶段','小组数'],rows:stages.map(([step,l])=>[l,gs.filter(g=>g.step===step).length]),spec:{type:'bar',x:'实验阶段',y:'小组数',yLabel:'小组',yDomain:[0,10],showValues:true,showLegend:false,colors:{'小组数':'#2868e8'}}}}
 return {id:'class-trend',title:'已提交小组变化',showHeader:false,height:210,columns:['开课时间','已提交小组'],rows:[['0 分钟',0],['10 分钟',0],['20 分钟',Math.min(1,done)],['30 分钟',done]],spec:{type:'line',x:'开课时间',y:'已提交小组',yLabel:'小组',yDomain:[0,10],showLegend:false,colors:{'已提交小组':'#2868e8'}}};
}
function chartSlot(id,kind){return `<div class="x-chartslot" id="${id}" data-chart="${kind}" data-viz-container><div class="x-empty">正在绘制图表…</div></div>`}
function inspectionCard(){return `<div class="x-bubble ai"><div class="x-bubblehead"><span class="x-aiicon">${I('sparkles')}</span>AI 助教 · 待确认</div><p>识别到一条检查发现：</p><p>${E(parsed.text)}</p><p class="x-chartnote">将标记为学生报告，保留原话；不自动作为故障真值。</p><div style="margin-top:13px">${B('确认检查记录','confirm-inspection','primary wide')}</div></div>`}
function drawCharts(){if(!chartMount)return;view.querySelectorAll('[data-chart]').forEach(el=>{let config=el.dataset.chart==='output'?outputConfig(s.history,el.id,el.closest('.x-phone')?190:230):classConfig(groups(),s.classChart);el.innerHTML='';chartMount(el,config)})}
import('https://persistent.oaistatic.com/plugins/visualize/charts/1.2.3/element.js').then(m=>{chartMount=m.mountChart;drawCharts()}).catch(()=>{view.querySelectorAll('[data-chart]').forEach(el=>el.innerHTML='<div class="x-empty">图表暂不可用，已保存的读数仍可查看。</div>')});
function studentHeader(){return `<header class="x-phonehead"><div class="x-row"><div class="x-brand"><span class="x-mark">${I('circuit-board')}</span>实验助教</div><span class="x-avatar">林</span></div><div class="x-subline" style="margin:10px 0 0"><span>电子电路基础 · 03 组</span><span>已同步</span></div></header>`}
function measurementChart(id){return `<section class="x-panel"><div class="x-panelhead"><div><span class="x-small x-muted">TP2 对 TP0 · 输出电压</span><div class="x-value">${fmt(s.current.vout)} <small>${s.current.vout==null?'':'V'}</small></div></div>${P(resultText(),result()==='pass'?'green':result()==='pending'?'':'amber')}</div>${chartSlot(id,'output')}<div class="x-chartnote">${s.history.length} 次手动测量 · 连线表示记录间的变化${result()==='pending'?' · 当前修订待测':''}</div></section>`}
function parsedCard(){if(!parsed)return '';if(parsed.kind==='inspection')return inspectionCard();if(parsed.kind==='question')return `<div class="x-bubble ai"><div class="x-bubblehead"><span class="x-aiicon">${I('sparkles')}</span>AI 助教</div><p>${E(parsed.answer)}</p>${B('需要更具体的提示','more-hint','link')}</div>`;if(parsed.kind==='modify')return `<div class="x-bubble ai"><div class="x-bubblehead"><span class="x-aiicon">${I('sparkles')}</span>AI 助教 · 待确认</div><p>识别到一次电路修改：</p><p>${E(parsed.text)}</p><label class="x-check"><input id="lv-poweroff" type="checkbox">我在断电状态下完成了修改</label>${B('确认修改，进入复测','confirm-modify','primary wide')}</div>`;
const v=parsed,missing=[];if(v.vin==null)missing.push('供电电压');if(v.vout==null)missing.push('输出电压');if(!v.ref)missing.push('参考地');
return `<div class="x-bubble ai"><div class="x-bubblehead"><span class="x-aiicon">${I('sparkles')}</span>AI 助教 · 请核对提取结果</div><p>我把这段话整理成了实验记录。</p><div class="x-extracted"><div class="x-extract"><span>供电 · TP1 对 ${E(v.ref||'参考地待定')}</span><strong>${v.vin==null?'待补充':fmt(v.vin)+' V'}</strong><small>${v.inheritedVin?'沿用当前修订已确认读数':'来自本次描述'}</small></div><div class="x-extract"><span>输出 · TP2 对 ${E(v.ref||'参考地待定')}</span><strong>${v.vout==null?'待补充':fmt(v.vout)+' V'}</strong><small>${E(v.rawOut||'来自本次描述')}</small></div></div><div class="x-linechips">${P('直流电压 · 本实验模板','blue')}${P('修订 '+s.revision)}${v.ref?P('参考地 '+E(v.ref)) :''}</div>${missing.length?`<p class="x-small" style="color:var(--amber)">还需要确认：${missing.join('、')}。</p>`:''}${!v.ref?`<div class="x-suggestions">${B('黑表笔接 TP0','set-reference','btn')}</div>`:''}${v.warning?`<div class="x-error">${E(v.warning)}</div>`:''}<details><summary>修正识别结果</summary><div class="x-fields"><div class="x-field"><label for="lv-edit-vin">供电，单位 V</label><input id="lv-edit-vin" type="number" inputmode="decimal" step="0.001" value="${v.vin??''}"></div><div class="x-field"><label for="lv-edit-vout">输出，单位 V</label><input id="lv-edit-vout" type="number" inputmode="decimal" step="0.001" value="${v.vout??''}"></div></div>${B('应用修正','apply-extract','link')}</details><div style="margin-top:13px">${B('核对无误，记入实验','confirm-measure','primary wide')}</div><p class="x-chartnote">保留原话。确认后才更新图表和诊断依据。</p></div>`}
function studentLab(){return `<div class="x-row"><h1>电阻分压实验</h1>${P(s.submitted?'已提交':'进行中','blue')}</div><div class="x-subline"><span>步骤 5 / 8 · 测量与排查</span><span>实物修订 ${s.revision}</span></div>${measurementChart('student-output')}<section class="x-chat"><div class="x-panelhead"><h2>实验对话</h2>${B('实验说明','instructions','link')}</div>${s.chat.slice(-2).map(m=>`<div class="x-bubble ${m.role==='user'?'user':'ai'}">${m.role!=='user'?`<div class="x-bubblehead"><span class="x-aiicon">${I('sparkles')}</span>AI 助教</div>`:''}<p>${E(m.text)}</p></div>`).join('')}${!s.chat.length?`<div class="x-bubble ai"><div class="x-bubblehead"><span class="x-aiicon">${I('sparkles')}</span>AI 助教</div><p>把仪器读数或检查发现直接告诉我，我来帮你整理。</p><p class="x-small x-muted">例如：供电 3.30 V，输出 80 mV，黑表笔接 TP0。</p></div>`:''}${parsedCard()}${s.teacherMessage?`<div class="x-bubble ai"><div class="x-bubblehead">${I('graduation-cap')}周老师</div><p>${E(s.teacherMessage)}</p></div>`:''}<div class="x-composer"><label class="sr-only" for="lv-student-input">描述测量或实验问题</label><textarea id="lv-student-input" maxlength="800" placeholder="输入读数、检查发现，或直接提问…">${E(raw)}</textarea><div class="x-composerfoot">${B('加照片','photo','link','camera')}${B('发送','parse','primary','send')}</div></div><input id="lv-photo" type="file" accept="image/*" hidden>${photoUrl?`<img class="x-photo" src="${photoUrl}" alt="本次实验照片">`:''}<div class="x-suggestions">${B('试填一段测量','example-measure','btn')}${B('记录修改','example-modify','btn')}${B('向教师求助','help','btn')}</div>${error?`<div class="x-error" role="alert">${E(error)}</div>`:''}</section>`}
function records(){let es=[{time:'14:06',title:'第 1 次测量',text:'供电 3.30 V，输出 0.08 V · 修订 1'},{time:'14:08',title:'第 2 次测量',text:'供电 3.30 V，输出 0.09 V · 修订 1'},{time:'14:10',title:'第 3 次测量',text:'供电 3.30 V，输出 0.08 V · 修订 1'},...s.events];return `<div class="x-timeline">${es.map(e=>`<div class="x-event"><time>${E(e.time)}</time><div>${E(e.title)}<p>${E(e.text)}</p></div></div>`).join('')}</div>`}
function studentRecords(){return `<div class="x-row"><h1>实验记录</h1>${P('本组可见')}</div><div class="x-subline"><span>原话、提取结果与操作关联保存</span></div><section class="x-panel">${records()}</section><div style="margin-top:16px">${B('整理实验结论','student:submit','primary wide')}</div>`}
function studentSubmit(){return `<div class="x-row"><h1>${s.feedback?'教师反馈':'实验结论'}</h1>${P(s.submitted?'已提交':'待提交','blue')}</div><div class="x-subline"><span>电阻分压实验 · 03 组</span></div><section class="x-panel"><div class="x-panelhead"><h3>已关联的证据</h3>${P(resultText(),result()==='pass'?'green':'amber')}</div><p>供电 ${fmt(s.current.vin)} V · 输出 ${fmt(s.current.vout)} V</p><p class="x-chartnote">${s.history.length} 次测量 · ${s.photo?'已有照片':'照片待补充'} · 修订 ${s.revision}</p></section><section class="x-panel"><div class="x-field"><label for="lv-conclusion">用自己的话解释</label><textarea id="lv-conclusion" maxlength="1000" ${s.submitted?'readonly':''} placeholder="预期是什么？哪条证据不符？你如何检查、修改和复测？">${E(s.conclusion)}</textarea></div><p class="x-chartnote">AI 可以整理记录，原理解释由你完成。</p></section>${s.feedback?`<section class="x-panel"><h3>周老师的反馈</h3><p style="margin-top:10px">${E(s.feedback)}</p></section>`:''}${!s.submitted?`<div style="margin-top:16px">${B('提交给教师','submit','primary wide')}</div>`:''}${error?`<div class="x-error" role="alert">${E(error)}</div>`:''}`}
function student(){return `<div class="x-stage viz-dotted-background"><div class="x-phone">${studentHeader()}<main class="x-phonebody">${s.studentPage==='records'?studentRecords():s.studentPage==='submit'?studentSubmit():studentLab()}${toast?`<div class="x-toast" role="status">${E(toast)}</div>`:''}</main><nav class="x-phonenav" aria-label="学生端导航">${[['lab','实验','messages-square'],['records','记录','chart-no-axes-combined'],['submit','提交','file-check-2']].map(([id,label,ic])=>`<button class="${s.studentPage===id?'on':''}" data-do="student:${id}">${I(ic)}${label}</button>`).join('')}</nav></div></div>`}
function side(){return `<aside class="x-side"><span class="x-sidelabel">教学空间</span>${[['class','课堂总览','layout-dashboard'],['copilot','AI 助教','sparkles'],['reports','实验提交','file-check-2'],['templates','实验模板','flask-conical']].map(([id,label,ic])=>`<button class="${s.teacherPage===id||id==='class'&&s.teacherPage==='group'?'on':''}" data-do="teacher:${id}">${I(ic)}${label}</button>`).join('')}<div class="x-sidefoot">电子电路基础<br>软件工程 2026 级<br><br>2026 秋季学期</div></aside>`}
function classPage(){let gs=groups(),done=gs.filter(g=>g.submitted).length,help=gs.filter(g=>g.help).length;return `<div class="x-heading"><div><h1>课堂总览</h1><p>电阻分压实验 · 本次课堂</p></div>${B('AI 生成课后小结','summary','btn','sparkles')}</div><div class="x-stats"><div class="x-stat"><strong>10</strong><span>实验小组</span></div><div class="x-stat"><strong>${help}</strong><span>主动求助</span></div><div class="x-stat"><strong>${done}</strong><span>已提交</span></div></div><section class="x-ai"><div class="x-aihead"><span class="x-aiicon">${I('sparkles')}</span><h2>AI 课堂摘要</h2>${P('基于已同步记录','blue')}</div><p>${s.help?'03 组正在求助，'+(result()==='pending'?'修改后尚待复测':result()==='pass'?'测量已符合判据，结论待核对':'输出与预期有偏差')+'；':''}07 组需要确认参考地，09 组处于离线暂存状态。</p><p>建议先处理求助，再复核 ${done} 份提交。异常原因仍需证据确认。</p><div class="x-actions">${B('准备分组指导','prepare-guidance','primary','sparkles')}${B('生成共性讲解','common','btn')}${B('起草提交反馈','prepare-feedback','link')}</div></section><div class="x-twocol"><section class="x-panel"><div class="x-panelhead"><h2>课堂进展</h2><div class="x-tabs" aria-label="课堂图表">${[['trend','提交趋势'],['stages','阶段分布']].map(([id,l])=>`<button class="${s.classChart===id?'on':''}" data-do="chart:${id}">${l}</button>`).join('')}</div></div>${chartSlot('teacher-class-chart','class')}<div class="x-chartnote">${s.classChart==='trend'?'示例课堂快照 · 最后一个节点为当前提交数':'按当前步骤汇总 · 每组仅计入一个阶段'}</div></section><section class="x-panel"><div class="x-panelhead"><h2>建议优先关注</h2>${P('教师决定')}</div>${[3,7].map(n=>`<div class="x-priority"><div class="x-row"><h3>${String(n).padStart(2,'0')} 组</h3>${P(n===3?resultText():'参考点待确认','amber')}</div><p>${n===3?'查看测量变化与本组排查依据。':'黑表笔位置尚未明确。'}</p>${B('查看并指导','group:'+n,'link')}</div>`).join('')}</section></div><div class="x-panelhead"><h2>小组进度</h2><div class="x-tabs">${[['all','全部'],['help','求助中']].map(([id,l])=>`<button class="${s.filter===id?'on':''}" data-do="filter:${id}">${l}</button>`).join('')}</div></div><div class="x-groups">${gs.filter(g=>s.filter==='all'||g.help).map(g=>`<button class="x-group ${g.help?'help':''}" data-do="group:${g.n}"><div class="x-row"><strong>${String(g.n).padStart(2,'0')} 组</strong>${P(g.submitted?'已提交':g.help?'求助中':g.offline?'离线':'进行中',g.submitted?'green':g.help?'amber':g.offline?'':'blue')}</div><p>${g.n===3?resultText():g.submitted?'等待复核结论':g.n===7?'参考点待确认':'当前步骤 '+g.step+' / 8'}</p><div class="x-bar"><span style="width:${g.step/8*100}%"></span></div><div class="x-small x-muted">${g.offline?'4 分钟前同步':'刚刚同步'}</div></button>`).join('')}</div>`}
function groupPage(){let n=s.group;return `${B('返回课堂','teacher:class','link','chevron-left')}<div class="x-heading" style="margin-top:12px"><div><h1>${String(n).padStart(2,'0')} 组实验过程</h1><p>${n===3?'林同学、陈同学 · 实物修订 '+s.revision:'本组实验记录与指导'}</p></div>${B('AI 起草本组指导','group-draft','primary','sparkles')}</div>${n===3?`<div class="x-twocol"><div>${measurementChart('group-output')}<section class="x-panel"><h2>过程时间线</h2>${records()}</section></div><div><section class="x-ai"><div class="x-aihead"><span class="x-aiicon">${I('sparkles')}</span><h2>AI 过程摘要</h2></div><p>本组已记录 ${s.history.length} 次测量。当前${resultText()}，请结合检查和修改记录核对。</p><div class="x-source" style="margin-top:12px"><span>测量记录</span><span>修订 ${s.revision}</span></div></section><section class="x-panel"><div class="x-field"><label for="lv-group-message">给本组的指导</label><textarea id="lv-group-message" placeholder="可以先用 AI 起草，再修改发送。">${E(s.groupDraft||'')}</textarea></div>${B('确认并发送','send-group','primary','send')}${s.teacherMessage?`<div class="x-notice">${E(s.teacherMessage)}<p class="x-chartnote">教师消息 · 已送达（演示）</p></div>`:''}</section></div></div>`:`<section class="x-panel"><h2>${n===7?'参考点待确认':'本组过程记录'}</h2><p style="margin:12px 0;color:var(--muted)">${n===7?'学生提问：“黑表笔应该接哪里？”暂无足够测量用于绘制趋势。':'当前暂无完整的测量序列；有新记录后显示趋势。'}</p><div class="x-field"><label for="lv-group-message">给本组的指导</label><textarea id="lv-group-message">${E(s.groupDraft||'')}</textarea></div>${B('确认并发送','send-group','primary')}</section>`}`}
function copilot(){return `<div class="x-heading"><div><h1>AI 教学助教</h1><p>描述教学任务，先预览草稿，再确认执行。</p></div>${P('教师保留决定权','blue')}</div><div class="x-copilot"><section class="x-ai"><div class="x-aihead"><span class="x-aiicon">${I('sparkles')}</span><h2>这节课，我可以帮您处理</h2></div><p>梳理求助、准备分组指导、起草反馈、整理课后小结。</p><div class="x-suggestions">${B('给待帮助组准备提示','prepare-guidance','btn')}${B('为已提交组起草反馈','prepare-feedback','btn')}${B('准备全班共性讲解','common','btn')}</div></section><div class="x-composer"><label class="sr-only" for="lv-teacher-input">描述教师任务</label><textarea id="lv-teacher-input" maxlength="800" placeholder="例如：给输出偏低的小组准备补测指导，并列出依据。"></textarea><div class="x-composerfoot"><span class="x-small x-muted">当前范围：本次分压实验课堂</span>${B('生成草稿','teacher-command','primary','sparkles')}</div></div>${drafts.length?`<div style="margin-top:24px"><div class="x-panelhead"><h2>${draftKind==='feedback'?'反馈草稿':'分组指导草稿'}</h2>${P(drafts.length+' 条待确认','blue')}</div>${drafts.map((d,i)=>`<section class="x-draft"><div class="x-row"><h3>${String(d.group).padStart(2,'0')} 组</h3>${P('可编辑草稿')}</div><div class="x-field"><label class="sr-only" for="lv-draft-${i}">第${d.group}组草稿</label><textarea id="lv-draft-${i}">${E(d.text)}</textarea></div><div class="x-source">${I('layers')}<span>${E(d.source)}</span></div></section>`).join('')}<div class="x-actions" style="margin-top:18px">${B('确认发送 '+drafts.length+' 条'+(draftKind==='feedback'?'反馈':'指导'),'send-drafts','primary','send')}${B('继续调整','focus-command','link')}</div><p class="x-chartnote">发送前可逐条修改。AI 不直接写入最终成绩。</p></div>`:''}</div>`}
function reports(){let ns=s.submitted?[3,2,6]:[2,6];return `<div class="x-heading"><div><h1>实验提交</h1><p>先读证据摘要，再核对学生解释。</p></div>${B('AI 起草反馈','prepare-feedback','primary','sparkles')}</div><section class="x-panel"><div class="x-panelhead"><h2>电阻分压实验</h2>${P(ns.length+' 份提交','blue')}</div><table class="x-table"><thead><tr><th>小组</th><th>复核状态</th><th class="x-hidephone">证据</th><th>操作</th></tr></thead><tbody>${ns.map(n=>`<tr><td>${String(n).padStart(2,'0')} 组</td><td>${P(s.reviews[n]?.returned?'待补充':s.reviews[n]?.feedback?'已反馈':'待复核',s.reviews[n]?.feedback?'green':'blue')}</td><td class="x-hidephone">测量、照片、结论</td><td>${B('查看','report:'+n,'link')}</td></tr>`).join('')}</tbody></table></section>`}
function templates(){return `<div class="x-heading"><div><h1>实验模板</h1><p>目标、测点与判据由教师确认后发布。</p></div>${B('AI 准备教学材料','template-ai','primary','sparkles')}</div><section class="x-panel"><div class="x-panelhead"><h2>电阻分压实验</h2>${P('v0.1 · 已审核','green')}</div><p>3.3 V 低压直流 · 两只 10 kΩ 电阻 · TP0、TP1、TP2</p><div class="x-linechips">${P('8 个实验步骤')}${P('分层指导')}${P('测量与过程评价')}</div>${B('查看学习目标与步骤','instructions','link')}</section>`}
function teacher(){return `<div class="x-shell"><header class="x-head"><div class="x-brand"><span class="x-mark">${I('circuit-board')}</span>实验助教<span class="x-headnote">教师工作台</span></div><div class="x-actions"><span class="x-small x-muted x-headcourse">电子电路基础</span><span class="x-avatar">周</span></div></header><div class="x-layout">${side()}<main class="x-main">${s.teacherPage==='copilot'?copilot():s.teacherPage==='group'?groupPage():s.teacherPage==='reports'?reports():s.teacherPage==='templates'?templates():classPage()}${toast?`<div class="x-toast" role="status">${E(toast)}</div>`:''}${error?`<div class="x-error" role="alert">${E(error)}</div>`:''}</main></div></div>`}
function dialogs(){if(!modal)return '';let title='',body='';if(modal==='common'){title='全班共性讲解草稿';body=`<div class="x-aihead"><span class="x-aiicon">${I('sparkles')}</span>${P('AI 起草 · 教师确认','blue')}</div><div class="x-field"><label for="lv-common">讲解内容</label><textarea id="lv-common" style="min-height:175px">测量电压时，先说明“目标节点对哪个参考点”。本实验黑表笔接 TP0，红表笔接被测节点。输出偏低时，先核对供电、参考点和表笔位置，再用补测区分连接与阻值问题，不要只凭一个读数确定故障。</textarea></div><div class="x-source"><span>07 组求助</span><span>分压实验教师资料</span></div><div style="margin-top:17px">${B('确认发布到课堂','send-common','primary wide')}</div>`}
if(modal==='summary'){title='课后小结草稿';body=`<div class="x-notice">依据当前已同步记录生成，未同步过程不计为未操作。</div><div class="x-field"><label for="lv-summary">可编辑小结</label><textarea id="lv-summary" style="min-height:210px">本次课堂共有 10 个实验小组，当前 ${groups().filter(g=>g.submitted).length} 组已提交。03 组的测量、检查与复测可作为排查案例；07 组提出参考点问题，可补充讲解电压的参考方向。09 组离线记录需待同步后核对。后续重点复核学生能否用证据解释结论，不能仅凭数值正常判断学习目标已达到。</textarea></div>${B('保存为教学小结草稿','save-summary','primary wide')}`}
if(modal==='instructions'){title='电阻分压实验';body=`<h3>学习目标</h3><p style="margin-top:9px">理解节点、参考地与分压关系；用补测区分候选原因。</p><div class="x-divider"></div><h3>实验步骤</h3><p style="margin-top:9px;line-height:2">预测输出 · 断电搭建 · 测供电 · 测输出 · 排查 · 修改与复测 · 解释结论 · 教师反馈</p><div class="x-notice">改线、换件、测电阻与通断前先断电。</div>`}
if(modal==='report'){let n=reportGroup;title=String(n).padStart(2,'0')+' 组实验复核';body=`<div class="x-row"><h3>证据摘要</h3>${P('教师核对','blue')}</div><p class="x-chartnote">${n===3?s.history.length:3} 次测量 · 当前输出 ${n===3?fmt(s.current.vout):'1.64'} V · 原始证据已关联</p><div class="x-divider"></div><h3>学生原始解释</h3><div class="x-reviewtext">${E(n===3?s.conclusion:'两只电阻相等，输出应接近供电的一半。实测供电 3.30 V、输出 1.64 V。黑表笔接 TP0，以 TP0 作为参考点。')}</div><div class="x-row"><h3>教师反馈</h3>${B('AI 起草','review-ai','link','sparkles')}</div><div class="x-field"><label class="sr-only" for="lv-feedback">教师反馈内容</label><textarea id="lv-feedback" placeholder="可让 AI 先起草，再修改确认。">${E(s.reviews[n]?.feedbackDraft||s.reviews[n]?.feedback||'')}</textarea></div><p class="x-chartnote">AI 草稿依据测量、学生解释与量表；不生成最终成绩。</p><div class="x-actions" style="margin-top:15px">${B('确认并反馈','save-review','primary')}${B('退回补充','return-review','btn')}</div>`}
if(modal==='template-ai'){title='AI 教学材料草稿';body=`<div class="x-field"><label for="lv-material">课前引导与反思问题</label><textarea id="lv-material" style="min-height:220px">课前引导：两只相等电阻串联接入 3.30 V，先预测中点相对参考地的电压。
测量提醒：记录被测节点、参考点、数值与单位；说明何时需要重新测量。
反思问题：相同的偏低输出能否确定是哪只电阻错误？下一次测量应如何区分候选原因？
评价重点：学生能否把检查、修改与复测对应到结论。</textarea></div>${B('保存为待审核材料','save-material','primary wide')}`}
return `<div class="x-overlay"><section class="x-dialog" role="dialog" aria-modal="true" aria-labelledby="lv-dialog-title"><div class="x-panelhead"><h2 id="lv-dialog-title">${title}</h2><button type="button" class="x-close" data-do="close" aria-label="关闭">${I('x')}</button></div>${body}</section></div>`}
function render(){root.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===s.role)));view.innerHTML=(s.role==='teacher'?teacher():student())+dialogs();globalThis.lucide?.createIcons({attrs:{width:18,height:18}});drawCharts();if(modal)view.querySelector('.x-close')?.focus({preventScroll:true})}
function parseText(text){let t=text.replace(/\s+/g,'');if(/(?:断电.*(?:改|接回|更换)|已改线|换了|修改了)/.test(t))return {kind:'modify',text};
 const value='(-?\\d+(?:\\.\\d+)?)\\s*(mV|毫伏|V|伏)';
 const get=prefix=>{let m=t.match(new RegExp('(?:'+prefix+')(?:电压)?(?:大约|约|为|是|[:：=])?'+value,'i'));return m?{value:Number(m[1])*(/mV|毫伏/i.test(m[2])?.001:1),raw:m[1]+' '+m[2]}:null};
 let vi=get('供电|输入|Vin|TP1(?:对TP0)?'),vo=get('输出|中点|Vout|TP2(?:对TP0)?');
 if(!vi&&!vo&&!/[?？]|怎么|为什么|哪里|测哪/.test(text)&&/检查|发现|通断|开路|导线/.test(text))return {kind:'inspection',text};
 if(!vi&&!vo)return {kind:'question',answer:/[?？]|怎么|为什么|哪里|测哪/.test(text)?(result()==='pending'?'当前修订还缺少测量。先测 TP1 对 TP0 的供电，再测 TP2 对 TP0 的输出。':result()==='pass'?'当前数值符合判据。请结合检查、修改和复测，说明结论的依据。':'先确认直流档与参考地。保持黑表笔在 TP0，测量供电，再比较 R1 两端对地电位。仅凭输出偏低不能确定具体故障。'):'暂时没有识别到明确的测量含义与单位。可以说“供电 3.30 V，输出 80 mV，黑表笔接 TP0”，也可以直接提出实验问题。'};
 let ref=/(?:黑表笔(?:接|在)?|参考(?:地|点)?(?:为|是|[:：=])?|对)(TP[0-9]+|GND)/i.exec(t)?.[1]?.toUpperCase()||s.current.ref;
 let vin=vi?.value??s.current.vin,vout=vo?.value??null,warning='';
 if(ref&&!['TP0','GND'].includes(ref))warning='参考点与模板不一致，请先核对黑表笔是否接在 TP0。';
 if(/交流|AC/i.test(text))warning='描述中出现交流档。本模板使用直流电压，请先核对档位。';
 if(vin!=null&&(vin<3.2||vin>3.4)||vout!=null&&(vout<0||vout>(vin??3.4)+.05))warning='读数超出当前模板条件，请核对单位、极性与供电。原话会保留，不自动改写数值。';
 return {kind:'measurement',vin,vout,ref,inheritedVin:!vi&&vin!=null,rawOut:vo?.raw,warning};
}
function prepare(kind='guidance',scope='all'){draftKind=kind;if(kind==='feedback')drafts=[2,6].map(n=>({group:n,text:'分压关系与参考地解释清楚，测量数值符合当前判据。建议补充仪器读数误差的来源，并说明数值符合判据与故障确认之间的区别。',source:'本组提交、测量与教师评价量表'}));else drafts=[...(s.help?[{group:3,text:result()==='pass'?'复测数值已符合判据。请整理检查、修改与复测证据，说明哪条证据支持结论。':result()==='pending'?'修改后请重新测量 TP1 对 TP0 的供电与 TP2 对 TP0 的输出，旧读数不能代替当前状态。':'请先核对参考地与表笔位置，再保持黑表笔在 TP0，分别测量 R1 两端的对地电压，并注明端点。',source:'03 组测量与当前修订'}]:[]),{group:7,text:'测电压需要明确参考点。本实验黑表笔接 TP0，红表笔接被测节点。请先确认实际位置，再记录读数与单位。',source:'07 组参考点求助、教师实验资料'}];if(scope==='low')drafts=drafts.filter(d=>d.group===3);s.teacherPage='copilot'}
root.addEventListener('click',e=>{let role=e.target.closest('[data-role]');if(role){s.role=role.dataset.role;parsed=null;modal=null;error='';toast='';render();save();return}let b=e.target.closest('[data-do]');if(!b)return;let a=b.dataset.do;toast='';error='';
if(a.startsWith('student:')){let text=view.querySelector('#lv-student-input');if(text)raw=text.value;let con=view.querySelector('#lv-conclusion');if(con&&!s.submitted)s.conclusion=con.value;s.studentPage=a.split(':')[1];parsed=null}
else if(a.startsWith('teacher:')){s.teacherPage=a.split(':')[1];modal=null}
else if(a.startsWith('group:')){s.group=Number(a.split(':')[1]);s.teacherPage='group';s.groupDraft=''}
else if(a.startsWith('filter:'))s.filter=a.split(':')[1];
else if(a.startsWith('chart:'))s.classChart=a.split(':')[1];
else if(a==='example-measure'){raw='供电 3.30 V，输出 80 mV，黑表笔接 TP0。';parsed=null}
else if(a==='example-modify'){raw='断电后，已将 R1 下端的导线接回 TP2，完成改线。';parsed=null}
else if(a==='parse'){raw=view.querySelector('#lv-student-input').value.trim();if(!raw){error='请先输入一段读数、检查发现或问题。'}else{parsed=parseText(raw);s.chat.push({role:'user',text:raw});s.chat=s.chat.slice(-4)}}
else if(a==='confirm-inspection'){event('确认检查发现',parsed.text+' · 来源：学生报告');s.chat.push({role:'ai',text:'检查发现已保存。若需要改线，请先断电；修改后重新测量供电与输出。'});s.chat=s.chat.slice(-4);parsed=null;raw='';toast='检查记录已加入时间线'}
else if(a==='set-reference'){parsed.ref='TP0'}
else if(a==='apply-extract'){let vi=view.querySelector('#lv-edit-vin').value,vo=view.querySelector('#lv-edit-vout').value;parsed.vin=vi===''?null:Number(vi);parsed.vout=vo===''?null:Number(vo);parsed.inheritedVin=false;parsed.rawOut='学生修正';parsed.warning=(parsed.vin!=null&&(parsed.vin<3.2||parsed.vin>3.4)||parsed.vout!=null&&(parsed.vout<0||parsed.vout>(parsed.vin??3.4)+.05))?'修正值仍超出模板条件，请核对。':''}
else if(a==='confirm-measure'){if(parsed.vin==null||parsed.vout==null||!parsed.ref)error='请先补齐供电、输出和参考地。可展开“修正识别结果”。';else if(parsed.warning)error='请先核对并修正可疑信息，再确认记录。';else{s.current={vin:parsed.vin,vout:parsed.vout,ref:parsed.ref};s.history.push({vin:parsed.vin,vout:parsed.vout,rev:s.revision});s.history=s.history.slice(-18);event('自然语言测量已确认',raw+' · '+parsed.ref+' · 修订 '+s.revision);let msg=result()==='pass'?'已记录并更新图表。当前数值符合判据，请结合检查与复测写出自己的结论。':'已记录并更新图表。输出与预期有偏差，请先核对参考地，再用补测区分可能原因。';s.chat.push({role:'ai',text:msg});s.chat=s.chat.slice(-4);parsed=null;raw='';toast='已确认的测量已加入实验证据'}}
else if(a==='confirm-modify'){if(!view.querySelector('#lv-poweroff').checked)error='请先确认修改是在断电状态下完成的。';else{event('记录修改',parsed.text+' · 新修订 '+(s.revision+1));s.revision++;s.current={vin:null,vout:null,ref:null};s.photo=false;s.submitted=false;s.chat.push({role:'ai',text:'修改已记录。请补充当前修订照片，再重新测量供电与输出。历史读数仍保留在图中。'});s.chat=s.chat.slice(-4);parsed=null;raw='';toast='已进入新的实物修订'}}
else if(a==='more-hint'){s.aiLevel=Math.min(3,s.aiLevel+1);parsed={kind:'question',answer:s.aiLevel===2?'保持黑表笔在 TP0，分别测量 R1 上端和下端对地电压。若 R1 下端与标记的 TP2 读数差别很大，再断电检查两者之间的连接。':'候选包括上方支路断开、额外接地与测点错误。请用测量和断电检查区分原因，不能只凭输出低就认定某个元件损坏。'}}
else if(a==='photo'){view.querySelector('#lv-photo').click();return}
else if(a==='help'){s.help=true;event('学生主动求助','等待教师指导');toast='已向教师发起求助（演示）'}
else if(['common','summary','instructions','template-ai'].includes(a))modal=a;
else if(a==='close')modal=null;
else if(a==='prepare-guidance')prepare('guidance');
else if(a==='prepare-feedback')prepare('feedback');
else if(a==='teacher-command'){let q=view.querySelector('#lv-teacher-input').value.trim();if(!q)error='请描述希望助教完成的教学任务。';else if(/反馈|批阅|评语/.test(q))prepare('feedback');else if(/讲解|全班|参考地/.test(q))modal='common';else if(/小结|总结/.test(q))modal='summary';else if(/输出偏低/.test(q)){if(result()==='low')prepare('guidance','low');else error='03 组当前没有已确认的偏低读数，请先核对当前数据。'}else if(/指导|补测|求助|提示|输出/.test(q))prepare('guidance');else error='本轮预览支持分组指导、反馈草稿、共性讲解与课堂小结。请具体说明任务。'}
else if(a==='focus-command'){view.querySelector('#lv-teacher-input')?.focus();return}
else if(a==='send-drafts'){drafts.forEach((d,i)=>{d.text=view.querySelector('#lv-draft-'+i).value.trim()});if(drafts.some(d=>!d.text))error='请补全每条草稿后再发送。';else{drafts.forEach(d=>{if(draftKind==='feedback'){s.reviews[d.group]={feedback:d.text};if(d.group===3)s.feedback=d.text}else if(d.group===3){s.teacherMessage=d.text;event('教师确认并发送指导',d.text)}});toast='已发送 '+drafts.length+' 条'+(draftKind==='feedback'?'反馈':'指导')+'（演示）';drafts=[]}}
else if(a==='group-draft'){s.groupDraft=s.group===7?'请确认黑表笔接 TP0、红表笔接被测节点，再记录读数与单位。':result()==='pass'?'复测数值已符合判据，请把检查、修改和复测对应到自己的结论。':'请保持黑表笔在 TP0，分别测量 R1 两端对地电压并标注端点，以区分上方支路连接与其他问题。';toast='已起草本组指导，请核对后发送'}
else if(a==='send-group'){let t=view.querySelector('#lv-group-message').value.trim();if(!t)error='请先填写或生成指导内容。';else{if(s.group===3){s.teacherMessage=t;event('教师发送指导',t)}toast='指导已发送至 '+String(s.group).padStart(2,'0')+' 组（演示）'}}
else if(a==='send-common'){s.teacherMessage=view.querySelector('#lv-common').value.trim();event('教师发布课堂讲解',s.teacherMessage);modal=null;toast='已向本次课堂发布讲解（演示）'}
else if(a==='save-summary'){s.summary=view.querySelector('#lv-summary').value;modal=null;toast='已保存可继续编辑的教学小结草稿'}
else if(a==='save-material'){s.material=view.querySelector('#lv-material').value;modal=null;toast='材料已保存为待审核草稿'}
else if(a.startsWith('report:')){reportGroup=Number(a.split(':')[1]);modal='report'}
else if(a==='review-ai'){s.reviews[reportGroup]={...s.reviews[reportGroup],feedbackDraft:'分压关系与参考地解释清楚，当前测量符合判据。建议补充仪器误差依据，并说明实验结论由哪些检查或复测支持。'};toast='已起草，等待教师核对'}
else if(a==='save-review'){let t=view.querySelector('#lv-feedback').value.trim();if(!t){error='请先填写反馈。';note(error);return}s.reviews[reportGroup]={feedback:t};if(reportGroup===3)s.feedback=t;modal=null;toast='教师反馈已确认并送达（演示）'}
else if(a==='return-review'){s.reviews[reportGroup]={returned:true};if(reportGroup===3){s.submitted=false;s.feedback='请补充检查与复测依据后重新提交。'}modal=null;toast='已退回补充，原提交保留（演示）'}
else if(a==='submit'){s.conclusion=view.querySelector('#lv-conclusion').value.trim();if(!s.conclusion)error='请先填写自己的解释。';else if(s.current.vin==null||s.current.vout==null)error='当前修订的测量尚未齐全，请先完成复测。';else if(!s.photo)error='请回到实验对话补充当前修订照片。';else{s.submitted=true;s.help=false;event('提交实验结论',s.conclusion);toast='已保存提交快照（演示）'}}
render();save();note(error||toast||'界面已更新')});
root.addEventListener('change',e=>{if(e.target.id==='lv-photo'&&e.target.files?.[0]){if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(e.target.files[0]);s.photo=true;event('关联实验照片','实物修订 '+s.revision+' · 本地预览');toast='照片已关联到当前修订（演示）';render();save()}});

const canonical=x=>JSON.stringify(x,(_,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(k=>[k,v[k]])):v);
window.addEventListener('openai:set_globals',e=>{let ui=e.detail?.globals?.widgetState?.privateContent?.ui;if(ui?.schema===2&&canonical({...base,...ui})!==canonical(s)){s={...base,...ui};parsed=null;modal=null;render()}});
render();const design={radius:12};if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--r',design.radius+'px')});tweak.addSlider(design,'radius',{label:'卡片圆角',min:6,max:22,step:2,unit:'px',reference:'--r'})}
})();
